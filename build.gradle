plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

configurations {
    runtimeClasspath.extendsFrom localImplementation
    compileClasspath.extendsFrom localImplementation
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    mavenLocal()
    maven {
        name = "ModMaven (MI, GrandPower, Tesseract, EI, JEI)"
        url = "https://modmaven.dev"
        content {
            includeGroup "aztech" // MI
            includeGroup "dev.technici4n"  // GrandPower
            includeGroup "net.swedz" // Tesseract
            includeGroup "mezz.jei" // JEI
        }
    }
    maven {
        name 'GTCEu Maven (ModularUI)'
        url 'https://maven.gtceu.com'
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/"
        content {
            // EMI
            includeGroup "dev.emi"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {

    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.technici4n:GrandPower:${grandpower_version}"
    implementation "aztech:Modern-Industrialization:${modern_industrialization_version}"
    implementation "net.swedz:tesseract-api-neoforge:${tesseract_version}"
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    jarJar(implementation("brachy.modularui:modularui-mc1.21.1:${modularui_version}")) {
        version {
            prefer "${modularui_version}"
        }
    }

    if (project.runtime_include_emi.toBoolean()) {
        localImplementation "dev.emi:emi-neoforge:${emi_version}"
    } else {
        compileOnly "dev.emi:emi-neoforge:${emi_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_github             : mod_github,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            modern_industrialization_version_range: modern_industrialization_version_range,
            tesseract_version_range: tesseract_version_range,
            modularui_version_range: modularui_version_range,

    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
